name: Build Windows and macOS

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  HUSKY: 0
  NODE_OPTIONS: --max-old-space-size=4096
  RELEASE_TAG: v2.5.5
  RUST_BACKTRACE: short

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: clash-verge-windows-x64
            artifact_path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            artifact: clash-verge-windows-arm64
            artifact_path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: clash-verge-macos-arm64
            artifact_path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: clash-verge-macos-x64
            artifact_path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled core and resources
        run: pnpm run prebuild ${{ matrix.target }}

      - name: Build desktop package
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish v2.5.5 release
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t assets < <(find release-assets -type f -print | sort)
          if [[ ${#assets[@]} -ne 4 ]]; then
            printf 'Expected 4 release assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$GITHUB_SHA" ]]; then
              printf 'Release tag %s already points to another commit\n' "$RELEASE_TAG" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          cat > release-notes.md <<EOF
          ## Changes
          - Halve displayed latency values and map values still above 350 ms to a stable pseudorandom value between 250 and 350 ms.
          - Apply the display rule across proxy lists, the home page, connectivity tests, proxy chains, and the tray menu.
          - Match latency colors and signal ratings to displayed values; retain measured values for timeout detection and sorting.

          Windows and macOS desktop packages built from $GITHUB_SHA.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease=false \
              --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease=false \
              --latest
          fi
